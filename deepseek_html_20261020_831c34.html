<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>风控仪表板</title>
<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c2330; --line:#2a3240;
    --txt:#e6edf3; --dim:#8b98a8; --acc:#2f81f7; --ok:#2ea043;
    --warn:#d29922; --bad:#f85149;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    padding:12px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  h1{font-size:17px;margin:0 0 10px;font-weight:600}
  h1 span{color:var(--dim);font-weight:400;font-size:12px;margin-left:6px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  input,select,button{font:inherit;border-radius:9px;border:1px solid var(--line);
    background:var(--panel);color:var(--txt);padding:10px 12px;outline:none}
  input{flex:1;min-width:110px}
  input:focus,select:focus{border-color:var(--acc)}
  button{cursor:pointer;background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  button.ghost{background:var(--panel);border-color:var(--line);color:var(--txt);font-weight:500}
  button.danger{background:var(--bad);border-color:var(--bad)}
  button:active{transform:scale(.98)}
  .status{font-size:12px;color:var(--dim);margin:2px 0 10px;min-height:16px}
  .status.err{color:var(--bad)}
  .status.ok{color:var(--ok)}
  .selfcheck{font-size:12px;margin:0 0 10px;padding:8px 10px;border-radius:9px;
    background:var(--panel);border:1px solid var(--line)}
  .selfcheck.ok{color:var(--ok);border-color:rgba(46,160,67,.4)}
  .selfcheck.bad{color:var(--bad);border-color:rgba(248,81,73,.4)}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;
    text-align:center;cursor:pointer}
  .card.active{border-color:var(--acc);background:var(--panel2)}
  .card b{display:block;font-size:20px;line-height:1.2}
  .card i{font-style:normal;font-size:11px;color:var(--dim)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--dim);
    padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:500}
  .chip.active{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  .slider{display:flex;align-items:center;gap:10px;margin-bottom:12px;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .slider label{font-size:12.5px;color:var(--dim);white-space:nowrap}
  .slider b{color:var(--txt)}
  input[type=range]{flex:1;padding:0;background:none;border:none;accent-color:var(--acc);height:24px}
  .admin{margin-bottom:12px;border:1px solid var(--line);border-radius:12px;
    background:var(--panel);overflow:hidden}
  .admin summary{padding:11px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--txt);
    list-style:none;display:flex;justify-content:space-between;align-items:center}
  .admin summary::-webkit-details-marker{display:none}
  .admin summary::after{content:"▾";color:var(--dim);transition:.2s}
  .admin[open] summary::after{transform:rotate(180deg)}
  .admin .body{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
  .admin .rowline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .admin .hint{font-size:11.5px;color:var(--dim);line-height:1.5}
  .admin .rowline label{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:6px;white-space:nowrap}
  .admin input[type=checkbox]{flex:0 0 auto;min-width:auto;padding:0;accent-color:var(--acc);width:18px;height:18px}
  .list{display:flex;flex-direction:column;gap:8px}
  .row{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
  .row:active{background:var(--panel2)}
  .rank{width:26px;flex:0 0 26px;text-align:center;color:var(--dim);font-weight:700;font-size:13px;padding-top:2px}
  .main{flex:1;min-width:0}
  .name{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .uid{color:var(--dim);font-size:11px;font-weight:400}
  .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
  .tag{font-size:11px;padding:2px 7px;border-radius:99px;background:#222c3a;color:var(--dim)}
  .tag.f{background:rgba(248,81,73,.15);color:var(--bad)}
  .score{flex:0 0 auto;text-align:right;font-weight:800;font-size:19px;line-height:1.1}
  .score small{display:block;font-size:10px;font-weight:500;color:var(--dim)}
  .s0{color:var(--dim)} .s1{color:var(--warn)} .s2{color:var(--bad)}
  .reasons{display:none;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
  .row.open .reasons{display:block}
  .reason{font-size:12.5px;padding:4px 0;display:flex;justify-content:space-between;gap:10px}
  .reason span:first-child{color:#c9d4e0}
  .reason time{color:var(--dim);white-space:nowrap;font-size:11px}
  .setbox{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .setbox input{flex:1;min-width:80px;padding:8px 10px}
  .setbox button{padding:8px 12px;font-size:12.5px}
  .empty{text-align:center;color:var(--dim);padding:40px 10px}
  .foot{text-align:center;color:var(--dim);font-size:11px;margin-top:16px}
  @media(min-width:720px){ body{max-width:760px;margin:0 auto;padding:20px} }
</style>
</head>
<body>

<h1>风控仪表板 <span id="meta">未连接</span></h1>

<div class="selfcheck" id="selfcheck">签名算法自检中…</div>

<div class="bar">
  <input id="blobId" placeholder="jsonblob ID" autocomplete="off">
  <button id="connect">连接</button>
</div>

<div class="bar">
  <input id="search" placeholder="搜索玩家名字或 UserId…" autocomplete="off">
  <button class="ghost" id="refresh">刷新</button>
</div>

<div class="status" id="status">正在初始化…</div>

<details class="admin">
  <summary>⚙ 自定义风控值（管理员）</summary>
  <div class="body">
    <div class="rowline">
      <input id="secret" type="password" placeholder="签名密钥（与地图 ServerStorage.RiskControlSecret 相同）">
    </div>
    <div class="rowline">
      <label><input type="checkbox" id="remember"> 记住密钥（仅存本机浏览器）</label>
    </div>
    <div class="rowline">
      <input id="manUid" placeholder="UserId（数字，离线也可）" inputmode="numeric">
      <input id="manScore" type="number" placeholder="风控值" inputmode="numeric" style="max-width:100px">
    </div>
    <div class="rowline">
      <input id="manReason" placeholder="原因（可空）">
    </div>
    <div class="rowline">
      <button id="manSet">设置风控值</button>
      <button class="ghost" id="manClear">重置为 0</button>
    </div>
    <div class="hint">
      设置后地图约 20 秒内读取并应用：在线玩家立即生效，离线玩家写入其 DataStore、下次进入生效。
      签名覆盖 UserId+分数+时间戳，密钥只存服务器，外挂无法伪造或重放。
    </div>
  </div>
</details>

<div class="cards">
  <div class="card active" data-filter="all"><b id="cTotal">0</b><i>监控中</i></div>
  <div class="card" data-filter="high"><b id="cHigh" class="s2">0</b><i>高风险 ≥100</i></div>
  <div class="card" data-filter="flagged"><b id="cFlag" class="s1">0</b><i>已标记</i></div>
</div>

<div class="chips" id="chips">
  <button class="chip active" data-filter="all">全部</button>
  <button class="chip" data-filter="flagged">已标记</button>
  <button class="chip" data-filter="high">高风险</button>
  <button class="chip" data-filter="mid">中风险</button>
  <button class="chip" data-filter="low">低分</button>
</div>

<div class="slider">
  <label>最低风险分 <b id="minVal">0</b></label>
  <input type="range" id="minScore" min="0" max="200" step="1" value="0">
</div>

<div class="list" id="list"><div class="empty">暂无数据</div></div>
<div class="foot">每 15 秒自动刷新 · 最多显示前 100 名</div>

<script>
(function(){
  "use strict";

  /* ================= 签名算法（与 Lua CryptoUtil 完全一致） ================= */
  var FNV_OFFSET = 2166136261;
  var FNV_PRIME = 16777619;
  var MOD32 = 4294967296;

  function fnv1a_32(str){
    var hash = FNV_OFFSET;
    for(var i=0;i<str.length;i++){
      var b = str.charCodeAt(i) & 0xff;
      hash = ((hash ^ b) >>> 0);
      hash = (hash * FNV_PRIME) % MOD32;
    }
    return hash;
  }
  function hex8(n){
    var v = (n >>> 0).toString(16);
    while(v.length < 8) v = "0" + v;
    return v;
  }
  function hash(data){
    data = String(data);
    var h1 = fnv1a_32(data);
    var h2 = fnv1a_32(String(h1) + data + "\x01");
    var h3 = fnv1a_32(String(h2) + data + "\x02");
    return hex8(h1) + hex8(h2) + hex8(h3);
  }
  function hmac(key, data){
    key = String(key); data = String(data);
    if(key.length > 64) key = hash(key);
    while(key.length < 64) key += "\u0000";
    var o = "", ip = "";
    for(var i=0;i<64;i++){
      var byte = key.charCodeAt(i) & 0xff;
      o  += String.fromCharCode(byte ^ 0x5c);
      ip += String.fromCharCode(byte ^ 0x36);
    }
    return hash(o + hash(ip + data));
  }

  /* ================= 自检（标准向量，来自真实服务器） ================= */
  (function selfTest(){
    var VEC = {
      hello:   "8da7dac0599f40a04721b610",
      abc:     "3852a5a0a7bb3223beabf5f8",
      empty:   "811c9dc57b8339dc629c6198",
      hmacHello:   "244350aeb0299e73483ac398",
      hmacPayload: "3be51cd8e5a6019060b40870"
    };
    var ok = true;
    ok = ok && hash("hello") === VEC.hello;
    ok = ok && hash("abc") === VEC.abc;
    ok = ok && hash("") === VEC.empty;
    ok = ok && hmac("TESTKEY123","hello") === VEC.hmacHello;
    ok = ok && hmac("TESTKEY123","12345|150|1700000000") === VEC.hmacPayload;
    var el = document.getElementById("selfcheck");
    if(ok){
      el.className = "selfcheck ok";
      el.textContent = "✓ 签名算法自检通过（与服务器一致）";
    } else {
      el.className = "selfcheck bad";
      el.textContent = "✗ 签名算法自检失败，请勿使用设置功能，联系开发者";
    }
    window.__sigOk = ok;
  })();

  /* ================= 状态 ================= */
  var DEFAULT_ID = "01a15909-2571-75b1-877b-0520e0ff184b";
  var REFRESH_MS = 15000;
  var state = { id:"", players:[], overrides:{}, q:"", filter:"all", minScore:0, timer:null };

  var $ = function(s){ return document.querySelector(s); };
  var elList = $("#list"), elStatus = $("#status"), elMeta = $("#meta"),
      elSearch = $("#search"), elId = $("#blobId");

  function setStatus(msg, cls){
    elStatus.textContent = msg;
    elStatus.className = "status" + (cls ? " " + cls : "");
  }
  function fmtTime(t){
    if(!t) return "";
    var d = new Date(t * 1000);
    if(isNaN(d.getTime())) return "";
    var p = function(n){ return n<10 ? "0"+n : ""+n; };
    return (d.getMonth()+1) + "/" + d.getDate() + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function scoreClass(v){ return v >= 100 ? "s2" : (v >= 40 ? "s1" : "s0"); }
  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function urlFor(id){
    if(!id) return null;
    id = id.replace(/^\s+|\s+$/g, "");
    if(id.indexOf("jsonblob.com") !== -1){
      var m = id.match(/api\/jsonBlob\/([^\/?#]+)/) || id.match(/jsonblob\.com\/([^\/?#]+)/);
      if(m) id = m[1];
    }
    return "https://jsonblob.com/api/jsonBlob/" + id;
  }
  function normReasons(rs){
    var out = [];
    if(!rs) return out;
    if(Array.isArray(rs)){
      for(var i=0;i<rs.length;i++){
        var r = rs[i];
        if(r && typeof r === "object" && r.reason) out.push({reason:String(r.reason), time:Number(r.time)||0});
        else if(typeof r === "string") out.push({reason:r, time:0});
      }
    } else if(typeof rs === "object"){
      for(var k in rs){ if(Object.prototype.hasOwnProperty.call(rs,k)) out.push({reason:k, time:Number(rs[k])||0}); }
    }
    return out;
  }
  function matchFilter(p){
    var f = state.filter;
    if(f === "flagged") return p.flagged;
    if(f === "high") return p.score >= 100;
    if(f === "mid") return p.score >= 40 && p.score < 100;
    if(f === "low") return p.score < 40;
    return true;
  }

  function render(){
    var q = state.q.toLowerCase().trim();
    var list = state.players.filter(function(p){
      if(q && String(p.name||"").toLowerCase().indexOf(q) === -1 && String(p.userId||"").indexOf(q) === -1) return false;
      if(!matchFilter(p)) return false;
      if(p.score < state.minScore) return false;
      return true;
    });
    list.sort(function(a,b){ return (b.score||0) - (a.score||0); });
    var shown = list.slice(0, 100);

    var high = 0, flagged = 0;
    for(var i=0;i<state.players.length;i++){
      if(state.players[i].score >= 100) high++;
      if(state.players[i].flagged) flagged++;
    }
    $("#cTotal").textContent = state.players.length;
    $("#cHigh").textContent = high;
    $("#cFlag").textContent = flagged;

    if(shown.length === 0){
      elList.innerHTML = '<div class="empty">' +
        (q || state.filter !== "all" || state.minScore > 0 ? "没有符合条件的玩家" : "暂无风控数据") + '</div>';
      return;
    }

    var html = "";
    for(var j=0;j<shown.length;j++){
      var p = shown[j];
      var sc = Math.round(p.score||0);
      var reasons = p.reasons;
      var tags = "";
      if(p.flagged) tags += '<span class="tag f">已标记</span>';
      if(reasons.length) tags += '<span class="tag">' + reasons.length + ' 项原因</span>';

      var rHtml = "";
      if(reasons.length){
        for(var k=0;k<reasons.length;k++){
          rHtml += '<div class="reason"><span>' + escapeHtml(reasons[k].reason) +
                   '</span><time>' + fmtTime(reasons[k].time) + '</time></div>';
        }
      } else {
        rHtml = '<div class="reason"><span style="color:#8b98a8">无记录原因</span><time></time></div>';
      }

      html += '<div class="row" data-uid="' + escapeHtml(String(p.userId||"")) + '">' +
        '<div class="rank">' + (j+1) + '</div>' +
        '<div class="main">' +
          '<div class="name">' + escapeHtml(p.name || "未知") +
            '<span class="uid">#' + escapeHtml(String(p.userId||"")) + '</span></div>' +
          '<div class="tags">' + tags + '</div>' +
          '<div class="reasons">' + rHtml +
            '<div class="setbox">' +
              '<input class="setVal" type="number" inputmode="numeric" placeholder="设为此分数">' +
              '<button class="setBtn">设置</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="score ' + scoreClass(sc) + '">' + sc + '<small>风险分</small></div>' +
      '</div>';
    }
    elList.innerHTML = html;
  }

  function applyRaw(data){
    var arr = (data && Array.isArray(data.players)) ? data.players : [];
    state.overrides = (data && typeof data.overrides === "object" && data.overrides) ? data.overrides : {};
    state.players = arr.map(function(e){
      return {
        userId: e.userId,
        name: e.name,
        score: Number(e.score) || 0,
        reasons: normReasons(e.reasons),
        lastSeen: Number(e.lastSeen) || 0,
        flagged: e.flagged === true || (Number(e.score)||0) >= 100
      };
    });
    var up = data && data.updatedAt ? fmtTime(data.updatedAt) : "未知";
    var pid = data && data.placeId ? (" · Place " + data.placeId) : "";
    elMeta.textContent = "更新于 " + up + pid;
    render();
  }

  function fetchData(){
    var url = urlFor(state.id);
    if(!url){ setStatus("请先填写 jsonblob ID", "err"); return; }
    setStatus("正在获取…");
    fetch(url + "?t=" + Date.now(), { cache:"no-store" })
      .then(function(r){
        if(!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(function(txt){
        var data = null;
        if(txt && txt.replace(/\s/g,"").length > 1){
          try { data = JSON.parse(txt); } catch(e){ data = null; }
        }
        if(!data){
          state.players = []; state.overrides = {}; render();
          setStatus("数据点为空：地图还没上传，或 HTTP 请求未开启", "err");
          return;
        }
        applyRaw(data);
        setStatus("已更新 · " + new Date().toLocaleTimeString(), "ok");
      })
      .catch(function(err){
        setStatus("获取失败：" + err.message + "（检查 ID 或网络）", "err");
      });
  }

  function getSecret(){
    var s = $("#secret").value || "";
    if(!s){
      try{ s = localStorage.getItem("risk_secret") || ""; }catch(e){}
    }
    return s;
  }

  function writeOverride(uidRaw, scoreRaw, reason){
    if(!window.__sigOk){ setStatus("签名算法自检失败，已阻止写入", "err"); return; }
    var digits = String(uidRaw || "").replace(/\D/g, "");
    if(!digits){ setStatus("UserId 无效（需纯数字）", "err"); return; }
    var uid = String(parseInt(digits, 10));
    var score = Math.floor(Number(scoreRaw));
    if(isNaN(score)){ setStatus("分数无效", "err"); return; }
    score = Math.max(0, score);

    var secret = getSecret();
    if(!secret){ setStatus("请填写签名密钥", "err"); return; }

    var url = urlFor(state.id);
    if(!url){ setStatus("请先连接", "err"); return; }

    var setAt = Math.floor(Date.now() / 1000);
    var payload = uid + "|" + score + "|" + setAt;
    var sig = hmac(secret, payload);
    var reasonText = (reason && String(reason).trim()) ? String(reason).trim() : "管理员手动设定";

    setStatus("正在写入…");
    fetch(url + "?t=" + Date.now(), { cache:"no-store" })
      .then(function(r){ return r.text(); })
      .then(function(txt){
        var data = null;
        if(txt && txt.replace(/\s/g,"").length > 1){
          try { data = JSON.parse(txt); } catch(e){}
        }
        if(!data) data = { players:[], overrides:{} };
        if(typeof data.overrides !== "object" || !data.overrides) data.overrides = {};
        if(!Array.isArray(data.players)) data.players = [];
        data.overrides[uid] = { score: score, reason: reasonText, setAt: setAt, sig: sig };
        if(!data.updatedAt) data.updatedAt = setAt;
        return fetch(url, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
      })
      .then(function(r){
        if(!r.ok) throw new Error("HTTP " + r.status);
        if($("#remember").checked){
          try{ localStorage.setItem("risk_secret", secret); }catch(e){}
        } else {
          try{ localStorage.removeItem("risk_secret"); }catch(e){}
        }
        setStatus("已提交签名，地图将在约 20 秒内应用", "ok");
        setTimeout(fetchData, 2000);
      })
      .catch(function(err){
        setStatus("写入失败：" + err.message, "err");
      });
  }

  function startTimer(){
    if(state.timer) clearInterval(state.timer);
    state.timer = setInterval(fetchData, REFRESH_MS);
  }

  function connect(){
    var id = (elId.value || DEFAULT_ID || "").replace(/^\s+|\s+$/g, "");
    if(!id){ setStatus("请填写 jsonblob ID", "err"); return; }
    state.id = id;
    try{ localStorage.setItem("risk_blob_id", id); }catch(e){}
    fetchData();
    startTimer();
  }

  function setFilter(f){
    state.filter = f;
    var nodes = document.querySelectorAll("[data-filter]");
    for(var i=0;i<nodes.length;i++){
      var n = nodes[i];
      if(n.getAttribute("data-filter") === f) n.classList.add("active");
      else n.classList.remove("active");
    }
    render();
  }

  document.addEventListener("click", function(ev){
    var t = ev.target;

    var setBtn = t.closest ? t.closest(".setBtn") : null;
    if(setBtn){
      var row = setBtn.closest(".row");
      var inp = row.querySelector(".setVal");
      writeOverride(row.getAttribute("data-uid"), inp.value, "");
      ev.stopPropagation();
      return;
    }

    var chip = t.closest ? t.closest("[data-filter]") : null;
    if(chip && (chip.classList.contains("chip") || chip.classList.contains("card"))){
      setFilter(chip.getAttribute("data-filter"));
      return;
    }
    var row2 = t.closest ? t.closest(".row") : null;
    if(row2 && !t.closest(".setbox")) row2.classList.toggle("open");
  });

  elSearch.addEventListener("input", function(){
    state.q = elSearch.value || "";
    render();
  });

  var slider = $("#minScore");
  slider.addEventListener("input", function(){
    state.minScore = Number(slider.value) || 0;
    $("#minVal").textContent = state.minScore;
    render();
  });

  $("#connect").addEventListener("click", connect);
  $("#refresh").addEventListener("click", fetchData);

  $("#manSet").addEventListener("click", function(){
    writeOverride($("#manUid").value, $("#manScore").value, $("#manReason").value);
  });
  $("#manClear").addEventListener("click", function(){
    writeOverride($("#manUid").value, 0, "管理员重置");
  });

  (function init(){
    var saved = "";
    try{ saved = localStorage.getItem("risk_blob_id") || ""; }catch(e){}
    var start = saved || DEFAULT_ID || "";
    if(start){ elId.value = start; connect(); }

    var savedSecret = "";
    try{ savedSecret = localStorage.getItem("risk_secret") || ""; }catch(e){}
    if(savedSecret){
      $("#secret").value = savedSecret;
      $("#remember").checked = true;
    }
  })();
})();
</script>
</body>
</html>
